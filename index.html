<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Meu primeiro site com JavaScript</h1>

        <div id="box1">
            <h2>Horário Atual</h2>
            <div id="clock"></div>
        </div>

        <div id="box2">
            <h2>Entrada no evento</h2>
            <label for="idade">Informe sua idade:</label>
            <input type="number" id="idade" placeholder="Sua idade" min="0" step="1">
            <button type="button" id="botaoVerificar">Verificar</button>
            <p id="resultado" aria-live="polite"></p>
        </div>

        <div id="box3">
            <h2>Aparência do site</h2>
            <button id="botaoTema">Mudar tema</button>
        </div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
